name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake qt6-base-dev qt6-declarative-dev \
            qt6-declarative-dev-tools nodejs
          qmake6 -query QT_VERSION

      - name: Configure & build wolfycore
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: CTest (script engine)
        run: ctest --test-dir build --output-on-failure

      - name: Node shim tests (example scripts)
        run: node tests/node/run-tests.js

      - name: qmllint shell QML
        run: bash tests/lint.sh
